# Example house model. Copy to house.yaml and fill in together during Phase 0.
# This file seeds the planner's database and documents "the house" in version control.

week_starts_on: monday
week_mode: fresh_start          # rebuild from baseline every Monday; history keeps "last done"
missed_items: auto_slide        # move to next slot that fits; else "whenever" tray
daily_digest: { at_slot_start: after_little_girls_sleep }   # right after the girls go down

# Slot times are SETTINGS she edits in the app; values here are only the starting seed.
# Two schedules: weekday (Mon–Fri) and weekend (Sat–Sun). `null` = slot doesn't exist that day type.
# Anchors are TAPS ("Girls are up", "Gigi is down"); a tap shifts that slot and offset slots after it.
day_types:
  weekday: [mon, tue, wed, thu, fri]
  weekend: [sat, sun]

slot_types:
  - id: before_truman_wakes
    name: "Before Truman wakes up"
    rules: { noise: quiet }
    times:
      weekday: { start: "06:00", minutes: 30 }
      weekend: { start: "07:00", minutes: 30 }
  - id: after_truman_leaves
    name: "After Truman leaves"
    rules: { noise: quiet }          # littles may still be asleep
    times:
      weekday: { start: "08:30", minutes: 30 }   # Truman leaves 8:30 on weekdays
      weekend: null
  - id: little_girls_wake
    name: "Little girls wake up"
    anchor: "Girls are up"
    times:
      weekday: { start: "09:00", minutes: 15 }
      weekend: { start: "08:00", minutes: 15 }
  - id: girls_settled
    name: "~2 hrs after girls are up"
    offset_from: little_girls_wake
    offset_minutes: 120
    times:
      weekday: { minutes: 45 }
      weekend: { minutes: 30 }
  - id: lunchtime
    name: "Lunchtime"
    times:
      weekday: { start: "11:45", minutes: 20 }
      weekend: { start: "12:00", minutes: 20 }
  - id: gigi_nap
    name: "Gigi's naptime"
    anchor: "Gigi is down"
    rules: { noise: quiet, no_vacuum_rooms: [gigi_room, hallway_up] }
    times:
      weekday: { start: "13:00", minutes: 90 }
      weekend: { start: "13:00", minutes: 90 }
  - id: early_evening
    name: "Early evening"
    times:
      weekday: { start: "16:00", minutes: 30 }
      weekend: { start: "16:00", minutes: 30 }
  - id: kids_activities
    name: "Kids' activities (transport)"
    source: calendar                 # busy block, generated from calendar events
    busy: true
  - id: dinner
    name: "Dinner time"
    category: meals
    times:
      weekday: { start: "17:30", minutes: 45 }
      weekend: { start: "17:30", minutes: 60 }
  - id: after_little_girls_sleep
    name: "After little girls go to sleep"
    anchor: "Girls are down"         # also triggers the daily digest
    rules: { noise: quiet }
    times:
      weekday: { start: "19:45", minutes: 45 }
      weekend: { start: "20:00", minutes: 45 }

rooms:
  - id: kitchen
    name: Kitchen
    floor: 1
    roborock_segment: 16      # from roborock.get_maps
    vacuum_every_days: 2
    mop_every_days: 7
  - id: living
    name: Living Room
    floor: 1
    roborock_segment: 17
    vacuum_every_days: 3
  - id: playroom
    name: Playroom
    floor: 1
    roborock_segment: 18
    vacuum_every_days: 4
    prep: ["Pick up floor toys"]
  - id: older_girls_room
    name: Older Girls' Room
    floor: 1
    roborock_segment: 19
    vacuum_every_days: 7
    prefer_when: kids_at_school
  - id: nursery
    name: Nursery
    floor: 1
    roborock_segment: 20
    vacuum_every_days: 7
    never_during: [gigi_nap]

# Connections between rooms. The planner computes reachability from the dock.
connections:
  - between: [kitchen, living]
    type: open
  - between: [living, playroom]
    type: gate
    sensor: binary_sensor.playroom_gate   # optional
  - between: [living, older_girls_room]
    type: door
  - between: [living, nursery]
    type: door

roborock:
  entity: vacuum.roborock
  dock_room: kitchen
  prep_notice_minutes: 15

tasks:
  - name: "Kitchen reset"
    scope: room
    room: kitchen
    minutes: 20
    every_days: 1
    slots: [girls_settled, gigi_nap, after_little_girls_sleep]
  # Whole-house tasks (her picks): windows and electronics dusting.
  - name: "Dust electronics"
    scope: house              # done across rooms; progress tracked per room
    minutes_per_room: 5
    every_days: 7
    rooms: [living, playroom, older_girls_room]
  - name: "Clean windows"
    scope: house
    minutes_per_room: 10
    every_days: 30
    rooms: [kitchen, living, playroom, older_girls_room, nursery]
  - name: "Wipe bathroom counters"
    scope: room
    room: older_girls_bath
    minutes: 10
    every_days: 3
  - name: "Change sheets"
    scope: room
    room: older_girls_room
    minutes: 20
    every_days: 7
    category: deep

routines:
  - name: "Girls' bathroom deep clean"
    every_days: 7
    tasks: ["Scrub tub", "Toilet", "Mirror", "Floor"]

quotas:
  - name: "Laundry: Kid A"
    per_week: 3
    minutes: 10          # time to start/move the load
    slots: [before_truman_wakes, after_truman_leaves]
# Mailbox and other kid chores stay in Skylight.

calendar_rules:
  - match: "Soccer Game"
    task: "Wash soccer uniform"
    due_before_hours: 12
  - match: "Practice"
    task: "Wash practice clothes"
    window: after_event_before_next

notifications:
  channel: ha_companion          # iPhone; HA app installed only as the notification pipe (she agreed)
  immediate: [vacuum_door_closed, vacuum_stuck, vacuum_tank_empty]
  slot_start_nudges: false       # her choice: daily digest only for now; can enable per slot later

meals:
  plan_weeks_ahead: 1            # she plans next week; app still allows further out
  prep_slots: [after_little_girls_sleep]   # plus weekend prep session
  stores: [heb, walmart]
  order_matching: manual         # phase 2: read order emails from her Gmail (HEB/Walmart/Instacart all go there)
