# Example house model. Copy to house.yaml and fill in together during Phase 0.
# This file seeds the planner's database and documents "the house" in version control.

week_starts_on: monday
week_mode: fresh_start          # rebuild from baseline every Monday; history keeps "last done"
missed_items: auto_slide        # move to next slot that fits; else "whenever" tray
daily_digest_slot: after_little_girls_sleep

# Her slots, in daily order. Times/minutes are placeholders to tune together.
# `anchor`: a tap ("Girls are up") or HA signal that shifts this slot and those after it.
slot_types:
  - id: before_truman_wakes
    name: "Before Truman wakes up"
    default_time: "05:45"
    minutes: 30
    rules: { noise: quiet }
  - id: after_truman_leaves
    name: "After Truman leaves"
    default_time: "07:30"
    minutes: 30
    days: [mon, tue, wed, thu, fri]
    rules: { noise: quiet }          # littles may still be asleep
  - id: little_girls_wake
    name: "Little girls wake up"
    default_time: "08:00"
    minutes: 15
    anchor: "Girls are up"
  - id: girls_settled
    name: "~2 hrs after girls are up"
    offset_from: little_girls_wake
    offset_minutes: 120
    minutes: 45
  - id: lunchtime
    name: "Lunchtime"
    default_time: "11:45"
    minutes: 20
  - id: gigi_nap
    name: "Gigi's naptime"
    default_time: "13:00"
    minutes: 90
    anchor: "Gigi is down"
    rules: { noise: quiet, no_vacuum_rooms: [gigi_room, hallway_up] }
  - id: early_evening
    name: "Early evening"
    default_time: "16:00"
    minutes: 30
  - id: kids_activities
    name: "Kids' activities (transport)"
    source: calendar                 # busy block, generated from events
    busy: true
  - id: dinner
    name: "Dinner time"
    default_time: "17:30"
    minutes: 45
    category: meals
  - id: after_little_girls_sleep
    name: "After little girls go to sleep"
    default_time: "19:45"
    minutes: 45
    rules: { noise: quiet }

rooms:
  - id: kitchen
    name: Kitchen
    floor: 1
    roborock_segment: 16      # from roborock.get_maps
    vacuum_every_days: 2
    mop_every_days: 7
  - id: living
    name: Living Room
    floor: 1
    roborock_segment: 17
    vacuum_every_days: 3
  - id: playroom
    name: Playroom
    floor: 1
    roborock_segment: 18
    vacuum_every_days: 4
    prep: ["Pick up floor toys"]
  - id: older_girls_room
    name: Older Girls' Room
    floor: 1
    roborock_segment: 19
    vacuum_every_days: 7
    prefer_when: kids_at_school
  - id: nursery
    name: Nursery
    floor: 1
    roborock_segment: 20
    vacuum_every_days: 7
    never_during: [gigi_nap]

# Connections between rooms. The planner computes reachability from the dock.
connections:
  - between: [kitchen, living]
    type: open
  - between: [living, playroom]
    type: gate
    sensor: binary_sensor.playroom_gate   # optional
  - between: [living, older_girls_room]
    type: door
  - between: [living, nursery]
    type: door

roborock:
  entity: vacuum.roborock
  dock_room: kitchen
  prep_notice_minutes: 15

tasks:
  - name: "Kitchen reset"
    scope: room
    room: kitchen
    minutes: 20
    every_days: 1
    slots: [girls_settled, gigi_nap, after_little_girls_sleep]
  - name: "Dust everywhere"
    scope: house              # done across rooms; progress tracked per room
    minutes_per_room: 5
    every_days: 7
    rooms: [living, playroom, older_girls_room]
  - name: "Wipe bathroom counters"
    scope: room
    room: older_girls_bath
    minutes: 10
    every_days: 3
  - name: "Change sheets"
    scope: room
    room: older_girls_room
    minutes: 20
    every_days: 7
    category: deep

routines:
  - name: "Girls' bathroom deep clean"
    every_days: 7
    tasks: ["Scrub tub", "Toilet", "Mirror", "Floor"]

quotas:
  - name: "Laundry: Kid A"
    per_week: 3
    minutes: 10          # time to start/move the load
    slots: [before_truman_wakes, after_truman_leaves]
# Mailbox and other kid chores stay in Skylight.

calendar_rules:
  - match: "Soccer Game"
    task: "Wash soccer uniform"
    due_before_hours: 12
  - match: "Practice"
    task: "Wash practice clothes"
    window: after_event_before_next

notifications:
  channel: ha_companion          # iPhone; HA app used only as the notification pipe
  immediate: [vacuum_door_closed, vacuum_stuck, vacuum_tank_empty]
  slot_start_nudges: false       # digest-only to start; turn on per slot if she wants

meals:
  plan_weeks_ahead: 4
  prep_slots: [after_little_girls_sleep]   # plus weekend prep session
  stores: [heb, walmart]
  order_matching: manual         # later: email
